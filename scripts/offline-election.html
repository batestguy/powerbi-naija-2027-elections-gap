<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; base-uri 'none'; form-action 'none'">
  <title>Naija Elections Gap</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f5f5;
      --surface: #fff;
      --ink: #1f1f1f;
      --muted: #505050;
      --line: #e4e4e4;
      --control-line: #767676;
      --blue: #0072b2;
      --orange: #d55e00;
      --wine: #882255;
      --gray: #767676;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--canvas); color: var(--ink);
      font: 13px/1.35 'Segoe UI', Arial, sans-serif;
      display: flex; flex-direction: column;
    }
    button, input, select { color: inherit; font: inherit; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    .viewport { flex: 1; min-height: 0; overflow: auto; }
    .frame { position: relative; margin: 0 auto; overflow: hidden; }
    .canvas { position: absolute; top: 0; left: 0; transform-origin: top left; }
    .visual { position: absolute; display: flex; flex-direction: column; min-width: 0; }
    .box { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
    .visual-title { margin: 0; padding: 7px 8px 2px; font-weight: 600; font-size: 17px; line-height: 1.22; }
    .textbox { overflow: auto; scrollbar-width: thin; }
    .textbox p, .textbox h1 { margin: 0; line-height: 1.35; overflow-wrap: anywhere; }
    .source-page .textbox p { line-height: 1.31; }
    .image { overflow: hidden; }
    .image img { display: block; flex: 1; min-height: 0; width: 100%; object-fit: contain; }
    .identity .card-value { line-height: 1.18; }
    .classic .visual-title { font-size: 10px; font-weight: 500; color: var(--muted); }
    .card-value {
      flex: 1; min-height: 0; display: grid; place-items: center; align-content: safe center;
      text-align: center; padding: 3px 8px; overflow: auto; scrollbar-width: thin;
      font-weight: 600; white-space: pre-line;
    }
    .kpis { display: grid; flex: 1; min-height: 0; gap: 8px; padding: 7px 8px; margin: 0; }
    .kpis > div {
      min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
      display: flex; flex-direction: column; justify-content: center; padding: 0 10px;
    }
    .cardVisual { background: var(--canvas); }
    .kpis dt { color: var(--muted); line-height: 1.05; margin-bottom: 3px; }
    .kpis dd { font-size: 18px; line-height: 1; margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
    .slicer { padding: 6px 8px; }
    .slicer label { display: block; margin-bottom: 4px; }
    .slicer select, .slicer input[type='number'] {
      background: var(--canvas); border: 1px solid var(--line); border-radius: 1px;
      padding: 4px 6px; min-height: 27px; color: var(--muted);
    }
    .slicer select { width: 100%; }
    .slicer input[type='number'] { width: 78px; font-size: 12px; }
    .slide { display: grid; gap: 3px; align-content: start; padding: 5px 8px; }
    .slide.compact-slide { gap: 1px; padding: 1px 8px; }
    .slide input[type='range'] {
      appearance: none; width: calc(100% - 26px); margin: 0 13px; height: 28px; background: transparent;
    }
    .compact-slide input[type='range'] { height: 26px; }
    .slide input[type='range']::-webkit-slider-runnable-track { background: var(--control-line); height: 3px; }
    .slide input[type='range']::-webkit-slider-thumb {
      appearance: none; background: var(--surface); border: 2px solid var(--ink);
      width: 25px; height: 25px; border-radius: 50%; margin-top: -11px; cursor: grab;
    }
    .slide input[type='range']::-moz-range-track { background: var(--control-line); height: 3px; }
    .slide input[type='range']::-moz-range-thumb {
      background: var(--surface); border: 2px solid var(--ink); width: 22px; height: 22px;
      border-radius: 50%; cursor: grab;
    }
    .slicer input:hover, .slicer select:hover { border-color: var(--control-line); }
    .figure, .tile-body, .matrix-body { flex: 1; min-height: 0; }
    .figure { padding: 3px 8px 5px; }
    svg { display: block; width: 100%; height: 100%; overflow: visible; }
    svg text { fill: var(--muted); font-family: inherit; }
    svg .grid-line { stroke: var(--line); }
    svg .quarter-line { stroke: var(--wine); }
    svg .quarter-label { fill: var(--wine); }
    svg rect[data-state]:hover, svg rect[data-state]:focus-visible { stroke: var(--ink); stroke-width: 1.5; }
    .geo path { stroke: var(--surface); stroke-width: .75; vector-effect: non-scaling-stroke; }
    .geo path:hover, .geo path:focus-visible { stroke: var(--ink); stroke-width: 2; }
    .matrix-body { margin: 5px 8px 8px; overflow: auto; scrollbar-width: thin; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
    th, td { padding: 4px 5px; line-height: 1.25; }
    thead th {
      position: sticky; top: 0; z-index: 1; text-align: left; font-weight: 500;
      background: var(--surface); border-bottom: 1px solid var(--ink);
    }
    tbody th { text-align: left; font-weight: 400; border-right: 1px solid var(--ink); }
    td.number { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:hover { background: var(--canvas); }
    .tile-body { display: grid; place-items: center; padding: 4px 8px 8px; }
    .tiles { display: grid; gap: 2px; }
    .tile {
      display: grid; place-items: center; border: 0; font-weight: 700; padding: 0;
      min-width: 0; min-height: 0; background: var(--canvas);
    }
    .tile:hover { outline: 1px solid var(--ink); outline-offset: -1px; }
    .empty { color: var(--muted); padding: 16px 8px; text-align: center; }
    .tabs {
      background: var(--surface); border-top: 1px solid var(--line); display: flex;
      align-items: stretch; min-height: 43px; flex: 0 0 auto;
    }
    .tabs button { border: 0; background: transparent; min-width: 40px; cursor: pointer; }
    .tabs button:hover { background: var(--canvas); }
    .tabs button:disabled { opacity: .38; cursor: default; }
    .tab-list { display: flex; flex: 1; overflow-x: auto; scrollbar-width: thin; }
    .tab-list button {
      flex: 0 0 auto; white-space: nowrap; padding: 7px 13px; border-bottom: 3px solid transparent;
      text-align: left; outline-offset: -3px;
    }
    .tab-list [aria-selected='true'] { border-bottom-color: var(--blue); font-weight: 600; }
    .tab-scroll { color: var(--muted); font-size: 20px; }
    .tabs .sound-toggle {
      flex: 0 0 83px; border-left: 1px solid var(--line); padding: 0 8px; white-space: nowrap;
      outline-offset: -3px;
    }
    .sound-toggle[aria-pressed='true'] { color: var(--blue); font-weight: 600; }
    .sound-credit a { color: var(--blue); }
    .tooltip {
      position: fixed; z-index: 2; top: 0; left: 0; max-width: min(320px, calc(100vw - 16px));
      white-space: pre-line; pointer-events: none; background: var(--surface);
      border: 1px solid var(--control-line); border-radius: 4px; padding: 6px 8px;
    }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <noscript>This report needs JavaScript enabled in your browser to show charts and run simulations.</noscript>
  <main class="viewport" id="viewport" aria-label="Election report">
    <div class="frame" id="frame" role="tabpanel" tabindex="0"><div class="canvas" id="canvas"></div></div>
  </main>
  <nav class="tabs" aria-label="Report pages">
    <button type="button" class="tab-scroll" id="tab-back" aria-label="Scroll report tabs left">‹</button>
    <div class="tab-list" id="tabs" role="tablist" aria-label="Report tabs"></div>
    <button type="button" class="tab-scroll" id="tab-next" aria-label="Scroll report tabs right">›</button>
    <button type="button" class="sound-toggle" id="sound-toggle" aria-label="Sound" aria-pressed="false" hidden>Sound off</button>
  </nav>
  <audio id="soundtrack" preload="none" loop hidden></audio>
  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div role="status" class="sr-only" id="status"></div>
  <script id="report-data" type="application/json">@@REPORT_DATA@@</script>
  <script>@@ENGINE@@</script>
  <script>@@UI@@</script>
</body>
</html>
